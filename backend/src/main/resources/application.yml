spring:
  application:
    name: zantrix-backend
  datasource:
    url: jdbc:postgresql://${ZANTRIX_DB_HOST:127.0.0.1}:${ZANTRIX_DB_PORT:5433}/${ZANTRIX_DB_NAME:zantrix_db}
    username: ${ZANTRIX_DB_USERNAME:zantrix}
    password: ${ZANTRIX_DB_PASSWORD:zantrix_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      # Flyway is the sole owner of the schema. Hibernate never mutates it.
      ddl-auto: validate
    open-in-view: false
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: 8080

logging:
  level:
    com.zantrix: DEBUG
