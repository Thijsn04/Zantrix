name: CI

on:
  push:
    branches: [master, "codex/**", "claude/**"]
  pull_request:
    branches: [master]

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        working-directory: backend
        run: ./mvnw -B clean verify

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Verify the generated API contract is current
        working-directory: frontend
        run: npm run verify:api
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Test
        working-directory: frontend
        run: npm test
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Audit production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

  end-to-end:
    name: Browser end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install browser test dependencies
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Start the complete stack
        run: docker compose up --build -d
      - name: Wait for application readiness
        run: |
          for attempt in $(seq 1 90); do
            if curl --fail --silent http://localhost:8080/actuator/health >/dev/null \
              && curl --fail --silent http://localhost:8081/realms/zantrix/.well-known/openid-configuration >/dev/null \
              && curl --fail --silent http://localhost:5173 >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          docker compose ps
          docker compose logs --tail=200 backend keycloak hapi-fhir frontend
          exit 1
      - name: Run browser flow
        working-directory: frontend
        run: npm run test:e2e
      - name: Capture service logs
        if: failure()
        run: docker compose logs --tail=300
      - name: Stop stack
        if: always()
        run: docker compose down --volumes

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5

  house-style:
    name: House style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: No em dashes
        run: |
          python3 - <<'PY'
          import pathlib, sys
          offenders = []
          for path in pathlib.Path('.').rglob('*'):
              if not path.is_file():
                  continue
              if '.git' in path.parts or 'node_modules' in path.parts:
                  continue
              try:
                  text = path.read_text(encoding='utf-8', errors='ignore')
              except Exception:
                  continue
              if chr(0x2014) in text:
                  offenders.append(str(path))
          if offenders:
              print('Em dashes are not allowed in this repository. Found in:')
              print('\n'.join(offenders))
              sys.exit(1)
          print('No em dashes found.')
          PY
