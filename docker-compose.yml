services:
  postgres:
    image: postgres:16-alpine
    container_name: zantrix-postgres
    environment:
      POSTGRES_USER: zantrix
      POSTGRES_PASSWORD: zantrix_password
      POSTGRES_DB: zantrix_db
    ports:
      - "5433:5432"
    volumes:
      - zantrix_pgdata:/var/lib/postgresql/data
      # Creates the hapi and keycloak databases on first initialization.
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zantrix -d zantrix_db"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.4
    container_name: zantrix-keycloak
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: zantrix
      KC_DB_PASSWORD: zantrix_password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"
    volumes:
      - ./realm-export.json:/opt/keycloak/data/import/realm-export.json
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Canonical FHIR store and API (ADR 0006). The Zantrix backend is a client of
  # this server. Not exposed to the public internet in a real deployment; the
  # backend is the secured gateway in front of it.
  hapi-fhir:
    image: hapiproject/hapi:v8.10.0-2
    container_name: zantrix-hapi-fhir
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/hapi
      SPRING_DATASOURCE_USERNAME: zantrix
      SPRING_DATASOURCE_PASSWORD: zantrix_password
      SPRING_DATASOURCE_DRIVERCLASSNAME: org.postgresql.Driver
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect
      HAPI_FHIR_FHIR_VERSION: R4
    ports:
      - "8090:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Standards-based terminology service. SNOMED CT licensed content is loaded
  # at deployment time and is never committed to this repository.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.1
    container_name: zantrix-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      node.name: zantrix-terminology
      cluster.name: zantrix-terminology
      ES_JAVA_OPTS: ${ZANTRIX_ES_JAVA_OPTS:--Xms2g -Xmx2g}
    volumes:
      - zantrix_terminology_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200/_cluster/health"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  terminology:
    image: snomedinternational/snowstorm:10.11.2
    container_name: zantrix-terminology
    entrypoint: >-
      java -Xms1g -Xmx${ZANTRIX_SNOWSTORM_MAX_HEAP:-3g}
      --add-opens java.base/java.lang=ALL-UNNAMED
      --add-opens java.base/java.util=ALL-UNNAMED
      -cp @/app/jib-classpath-file org.snomed.snowstorm.SnowstormApplication
      --elasticsearch.urls=http://elasticsearch:9200
    ports:
      - "8082:8080"
    depends_on:
      elasticsearch:
        condition: service_healthy
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: zantrix-backend
    environment:
      ZANTRIX_DB_HOST: postgres
      ZANTRIX_DB_PORT: 5432
      ZANTRIX_FHIR_BASE_URL: http://hapi-fhir:8080/fhir
      ZANTRIX_TERMINOLOGY_BASE_URL: http://terminology:8080/fhir
      ZANTRIX_RXNORM_BASE_URL: ${ZANTRIX_RXNORM_BASE_URL:-https://rxnav.nlm.nih.gov/REST}
      ZANTRIX_CONSENT_MODE: ${ZANTRIX_CONSENT_MODE:-deny-on-explicit}
      # Tokens use the browser-facing issuer while keys are retrieved over the
      # private Compose network. This keeps issuer validation exact.
      ZANTRIX_OIDC_ISSUER_URI: ${ZANTRIX_OIDC_ISSUER_URI:-http://localhost:8081/realms/zantrix}
      ZANTRIX_OIDC_JWK_SET_URI: ${ZANTRIX_OIDC_JWK_SET_URI:-http://keycloak:8080/realms/zantrix/protocol/openid-connect/certs}
      ZANTRIX_CORS_ALLOWED_ORIGINS: ${ZANTRIX_CORS_ALLOWED_ORIGINS:-http://localhost:5173}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      hapi-fhir:
        condition: service_started
      terminology:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
        VITE_OIDC_AUTHORITY: ${VITE_OIDC_AUTHORITY:-http://localhost:8081/realms/zantrix}
        VITE_OIDC_CLIENT_ID: ${VITE_OIDC_CLIENT_ID:-zantrix-frontend}
    container_name: zantrix-frontend
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

volumes:
  zantrix_pgdata:
  zantrix_terminology_data:
